packages:
  - packages/*
  - indexer
  - keeper
  - web
# Tedarik zinciri kapisi: bir paket ancak yayinlandiktan 1440 dakika (24 saat)
# sonra kurulabilir. Bu, pnpm 11'in yerlesik varsayilanidir; burada acikca
# yazilmasinin nedeni bir okuyucunun bu kurali gormesini saglamak ve gelecekte
# bir pnpm major surumu varsayilani degistirirse bu kararin sessizce
# buharlasmamasidir.
minimumReleaseAge: 1440
allowBuilds:
  # esbuild's install script places its platform binary; vitest and tsx depend
  # on it for TypeScript compilation. Without this, tests and tsx cannot run.
  esbuild: true
  # sharp is an optional dependency of next, used only for image processing.
  # Phase 0 renders no images and never calls next/image, so its install script
  # -- which downloads and links prebuilt native libvips binaries -- buys us
  # nothing today. Recording `false` resolves pnpm's pending state without
  # granting the script. Revisit when token artwork lands (Phase 4).
  sharp: false
