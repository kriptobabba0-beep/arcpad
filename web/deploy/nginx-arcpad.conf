# arcpad -- the reverse proxy in front of `next start`.
#
# Install:  /etc/nginx/sites-available/arcpad
#           ln -s ../sites-available/arcpad /etc/nginx/sites-enabled/arcpad
#           rm /etc/nginx/sites-enabled/default      <-- do not skip this
#
# The two `limit_req_zone` lines must live in the `http` block, not here.
# `docs/runbooks/web-vps.md` §4 gives them and says why they are separate.

# ---------------------------------------------------------------------------
# THIS FILE ADDS NO SECURITY HEADERS, DELIBERATELY.
#
# `web/next.config.ts` already sets CSP, Referrer-Policy, X-Frame-Options,
# X-Content-Type-Options and Permissions-Policy on every response, and
# `e2e/audit/network.spec.ts` proves the CSP against a real browser. An
# `add_header Content-Security-Policy` here would not replace that one, it
# would ADD A SECOND -- and a browser given two CSP headers enforces the
# INTERSECTION. The result is a policy nobody wrote, which fails closed on
# whatever the two disagree about, and the audit suite would still pass
# because it tests the app, not this proxy.
#
# The one header that belongs here is HSTS, because it is a statement about
# the TRANSPORT and only becomes true once TLS exists. It is in the TLS
# server block below, commented out with the reason.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ---- until a domain exists -------------------------------------------
    # With no domain there is no certificate, so this block SERVES the app
    # over plain HTTP. That is a staging posture, not a shipping one, and
    # §5 of the runbook says what it costs: WalletConnect refuses
    # non-secure origins outright, and every wallet that does connect shows
    # the visitor a warning on a page that asks them to sign transactions.
    #
    # The moment a domain points here, run certbot and this block becomes
    # the redirect that is currently commented out below.
    # ----------------------------------------------------------------------
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/arcpad.access.log;
    error_log  /var/log/nginx/arcpad.error.log;

    # A request body larger than this is refused before it reaches Node.
    # 16k is far above anything the site posts except one route, which
    # raises it locally.
    client_max_body_size 16k;

    # Next serves pre-compressed assets itself; this covers the HTML and the
    # JSON payloads, which are the ones a slow phone waits on.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- the write path --------------------------------------------------
    # The application already limits chat to 5 messages per 60s per
    # (token, author), enforced INSIDE the insert transaction -- that is the
    # correctness boundary and it cannot be bypassed by rotating IPs.
    #
    # This limit is a different control for a different attack: a flood of
    # INVALID posts never reaches that check, because the route verifies an
    # ECDSA signature first. Signature recovery costs real CPU, so the cheap
    # refusal has to come before it. Two controls, two threat models.
    location = /api/chat {
        limit_req zone=arcpad_write burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # 5 MiB is `MAX_IMAGE_BYTES` in `web/app/api/metadata/route.ts`; the
    # extra megabyte is multipart framing. Keeping the two numbers close
    # matters: if nginx were the tighter of the two, the user would get a
    # bare 413 instead of the route's own message naming the limit.
    location = /api/metadata {
        client_max_body_size 6m;
        limit_req zone=arcpad_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        # An upload to a pinning provider is not a fast request.
        proxy_read_timeout 120s;
    }

    # ---- token artwork ---------------------------------------------------
    # MEASURED, not estimated: a cold explore page draws 48 cards, and 48
    # concurrent image requests overran `location /`s burst of 40 -- three
    # came back 429, which on screen is three tokens that lost their picture
    # and never got it back on that render.
    #
    # A higher ceiling is safe precisely here. These are the cheapest requests
    # we serve: `/api/ipfs/` answers from a local file in about 8 ms, and it
    # sends `immutable`, so a given browser asks for a given CID once ever.
    # The upstream cost is bounded by the route's own single-flight, not by
    # this number.
    location /api/ipfs/ {
        limit_req zone=arcpad_read burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # ---- everything else -------------------------------------------------
    location / {
        limit_req zone=arcpad_read burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Next's immutable build output. The hash is in the filename, so a long
    # max-age is safe and a short one wastes a round trip on every visit.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ---------------------------------------------------------------------------
# THE TLS BLOCK -- uncomment after `certbot --nginx -d <domain>` and after
# turning the redirect above back on.
#
# HSTS IS COMMENTED OUT ON PURPOSE, EVEN HERE. `max-age=63072000` tells every
# browser that has ever visited to refuse plain HTTP for two years, and it is
# NOT undoable by removing the header -- only by serving `max-age=0` for long
# enough that every visitor sees it. Turn it on once the certificate has
# renewed automatically at least once, not on the day it is issued.
# ---------------------------------------------------------------------------
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name <domain>;
#
#     ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     ... the same four location blocks as above ...
# }
