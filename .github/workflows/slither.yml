name: static-analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.6.0-rc1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer

      # Ucuncu taraf bir action yerine dogrudan slither cagrilir: action'in
      # surumunu tahmin etmek gerekmez ve yerelde `make slither` ile CI'da
      # calisan komut birebir aynidir.
      - name: Slither
        working-directory: contracts
        run: slither . --config-file slither.config.json --fail-medium
