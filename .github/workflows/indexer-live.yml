name: indexer-live

# CANLI ARC TESTNET ENTEGRASYON TESTI.
#
# AYRI BIR DOSYADIR, `node.yml`e EKLENMEDI: o dosya su anda baska bir izlekte
# duzenleniyor ve paylasilan bir checkout'ta ayni dosyaya iki taraftan yazmak
# gereksiz bir catisma yaratirdi. Islev ayni: ayri, ENGELLEMEYEN bir job.
#
# `continue-on-error` KALDIRILDI 2026-08-10. Onceki hal ADIM seviyesindeydi ve
# gerekcesi olculmus bir arizadan geliyordu (Faz 0 devir listesi, satir 41):
# JOB seviyesine konuldugunda basarisizlik YESIL gorunur ve kapinin degeri
# sifira duser. O gerekce dogruydu ve hala dogru -- ama yetmedi.
#
# OLCULEN SONUC: bu is Faz 2 yeniden deploy'undan beri KIRMIZIYDI (eski factory,
# eski smoke cifti, eski totalOwed) ve KIMSE FARK ETMEDI. Adim kirmizi kaliyordu
# ama job'un sonucu etkilenmedigi icin GitHub hicbir bildirim gondermiyordu.
# Runbook'un heartbeat'ler icin yazdigi cumle burada da gecerliydi: kimsenin
# saymadigi bir gozlem dekorasyondur.
#
# NEDEN SIMDI KALDIRMAK UCUZ: bu is bir GUNLUK CRON, her push'ta kosmuyor.
# "Canli zincir testini her push'ta kosturmak RPC'yi yorar ve kendi kendini
# flake yapar" gerekcesi SIKLIGA aitti, ve siklik zaten gunde bir. Job kirmizi
# olunca GitHub'in kendi bildirimi devreye girer -- ek dakika maliyeti YOK.
#
# VE ENGELLEYICI DEGIL: bu bir cron, bir PR kapisi degil. Kirmizi olmasi hicbir
# merge'i durdurmuyor; yalnizca gorunur kiliyor.

on:
  schedule:
    # Gunde bir kez. Canli zincire karsi kosan bir testi her push'ta
    # kosturmak, testnet RPC'sine gereksiz yuk bindirir ve hiz sinirine
    # tosladiginda kendi kendini flake yapar (Arc'in -32011'i olculdu).
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arcpad
          POSTGRES_PASSWORD: arcpad
          POSTGRES_DB: arcpad
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # FACTORY ADRESI ARTIK BURAYA YAZILMIYOR.
      #
      # Onceki hali `ARC_FACTORY_ADDRESS: '0x0d75a4ff...'` idi ve bu, defterin
      # ustunden atlayan bir KOPYAYDI. Faz 2 `LaunchFactory`nin constructor'ina
      # `feeSchedule` argumanini ekliyor, yani initcode -- ve CREATE2 adresi --
      # DEGISIYOR. Yeniden deploy edildigi gun defter guncellenir, bu satir
      # guncellenmez, ve is akisi hicbir sey baslatmayan bir factory'yi izleyip
      # YESIL rapor eder. Baska her tuketici defteri okuyor
      # (`keeper/src/config.ts` -> `loadAddressBook(chainId)`), yalnizca burasi
      # okumuyordu.
      #
      # `--env-only` ARC_FACTORY_ADDRESS, ARC_ESCROW_ADDRESS ve
      # ARC_START_BLOCK'u birlikte yazar; ucu de defterden gelir ve
      # `loadAddressBook` ucunu de dogrular.
      - name: Chain env, from the address book
        run: pnpm addressbook --env-only >> "$GITHUB_ENV"

      # continue-on-error YOK. Test ATLAMAZ: ARC_RPC_URL yoksa dosya cokerek
      # "kosmadi"yi gorunur kilar -- yani bir sessiz atlama da kirmizi verir.
      - name: Live integration test
        run: pnpm --filter @arcpad/indexer test:live
        env:
          DATABASE_URL: postgres://arcpad:arcpad@localhost:5432/arcpad
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL || 'https://rpc.testnet.arc.network' }}
