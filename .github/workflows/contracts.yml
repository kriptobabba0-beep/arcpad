name: contracts

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    # GitHub Actions YAML anchor/alias desteklemez; liste bilerek tekrarlanir.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"

# Ayni dal icin yeni bir kosu basladiginda eskisini iptal et. Ard arda iki
# push yapildiginda birincinin kosusu sonuna kadar calisip Actions dakikasi
# yakiyordu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.6.0-rc1

      - name: Formatting
        run: forge fmt --check --root contracts

      - name: Build
        run: forge build --root contracts --sizes

      - name: Test
        run: forge test --root contracts --no-match-path 'test/fork/*' -vv
        env:
          FOUNDRY_PROFILE: ci

  fork:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.6.0-rc1

      # Fork testleri harici bir RPC'ye baglidir; kesintisi PR'lari
      # bloklamamali, ama Arc davranisindaki bir degisikligi erken gormeliyiz.
      - name: Arc fork test
        run: forge test --root contracts --match-path 'test/fork/*' --fork-url https://rpc.testnet.arc.io -vv
