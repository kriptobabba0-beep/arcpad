name: node

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    # GitHub Actions YAML anchor/alias desteklemez; liste bilerek tekrarlanir.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"

# Ayni dal icin yeni bir kosu basladiginda eskisini iptal et. Ard arda iki
# push yapildiginda birincinin kosusu sonuna kadar calisip Actions dakikasi
# yakiyordu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # `@arcpad/db` testleri GERCEK bir Postgres ister ve veritabani yoksa
    # ATLAMAZ, COKER (packages/db/test/setup.ts). Bu servis olmadan `pnpm -r
    # test` adimi kirmizi olur -- bilerek: Faz 0'in devir listesi (satir 41-42)
    # "hicbir CI is akisi henuz calismadi, kapilarin degeri sifir" diye
    # kaydetti; atlayan bir veritabani testi ayni siniftir.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arcpad
          POSTGRES_PASSWORD: arcpad
          POSTGRES_DB: arcpad
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
        env:
          DATABASE_URL: postgres://arcpad:arcpad@localhost:5432/arcpad

      - name: Build web
        run: pnpm --filter @arcpad/web build

  # THE ABI PARITY GATE, IN ITS OWN JOB.
  #
  # `packages/shared/src/abi/*` is the one copy of the ABI the frontend ships,
  # and it is committed rather than generated at build time so that `web` builds
  # without a Solidity toolchain. The price of committing it is drift, and this
  # job is what makes drift impossible to merge: it builds the contracts and
  # compares BOTH DIRECTIONS -- a removed entry and an ADDED entry are both
  # failures.
  #
  # Separate from `check` because `check` must keep running on a runner with no
  # Foundry; `test:abi` is deliberately NOT part of `pnpm -r test` for the same
  # reason. The risk that buys is a test that never runs anywhere, and
  # `abi-parity.test.ts` closes it by asserting this job exists.
  abi-parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.6.0-rc1

      - name: Build contracts
        run: forge build --root contracts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ABI parity
        run: pnpm --filter @arcpad/shared test:abi
